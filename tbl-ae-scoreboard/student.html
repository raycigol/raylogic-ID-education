<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 TBL AE｜學生查分</title>
<style>:root{--bg:#eef3f8;--paper:#fff;--ink:#182c43;--line:#d7e1ec;--accent:#136c89;--muted:#66778c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:#122b44;color:white;padding:24px max(20px,calc((100vw - 1080px)/2))}h1{font-size:1.5rem;margin:0 0 6px}header p{margin:0;color:#bed2e0}main{max-width:1120px;margin:auto;padding:20px}.panel{background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}.head{padding:17px 19px;border-bottom:1px solid var(--line);font-weight:700}.notice{background:#e5eff5;border-radius:10px;padding:13px 15px;line-height:1.6;margin-bottom:16px}.sub{color:var(--muted);font-size:.9rem}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:690px;text-align:center;font-variant-numeric:tabular-nums}th,td{padding:13px 10px;border-bottom:1px solid var(--line)}thead th{background:#f5f9fc}td:first-child,th:first-child{text-align:left;padding-left:18px}td.total{font-weight:800}.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:15px}.tile{border:1px solid var(--line);border-radius:10px;padding:13px;background:#f8fbfd}.tile b{display:block}.tile strong{font-size:1.35rem;color:var(--accent)}.error{padding:22px;text-align:center}footer{color:var(--muted);padding:12px 0 25px;font-size:.85rem}@media(max-width:680px){main{padding:12px}header{padding:18px}}</style>
</head><body><header><h1>2026 ID Block TBL｜AE 學生查分</h1><p>僅顯示教師已公布的分數與排名，不顯示題目或答案</p></header><main><div class="notice" id="notice">這是教師分享當下的唯讀成績快照，並非即時同步。若有後續階段鎖定或分數更新，請向教師取得新的連結。</div><section class="panel"><div class="head">13 組分數總覽</div><div class="wrap"><table><thead><tr><th>組別</th><th>Stage 1<br><small>／10</small></th><th>Stage 2<br><small>／25</small></th><th>Stage 3<br><small>／35</small></th><th>Stage 4<br><small>／30</small></th><th>累計<br><small>／100</small></th><th>名次</th></tr></thead><tbody id="tbody"></tbody></table></div></section><section class="panel"><div class="head">目前排行榜</div><div class="leaders" id="leaders"></div></section><footer>唯讀檢視 · 成績資料包含在教師分享的網址中，請勿公開轉傳含有個人資訊的連結。</footer></main>
<script>(()=>{'use strict';const get=id=>document.getElementById(id),fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);function decode(v){let x=v.replaceAll('-','+').replaceAll('_','/');x+='='.repeat((4-x.length%4)%4);let s=atob(x),bytes=Uint8Array.from(s,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}function valid(d){return d&&d.v===1&&typeof d.at==='string'&&Array.isArray(d.locks)&&d.locks.length===4&&d.locks.every(v=>typeof v==='boolean')&&Array.isArray(d.teams)&&d.teams.length===13&&d.teams.every(t=>typeof t.n==='string'&&t.n.length<=100&&Array.isArray(t.s)&&t.s.length===4&&t.s.every((x,i)=>x===null||(d.locks[i]&&Number.isFinite(x)&&x>=0&&x<=[10,25,35,30][i])))}try{if(!location.hash)throw Error('這個網址沒有成績快照。請使用教師產生的分享連結。');const d=JSON.parse(decode(location.hash.slice(1)));if(!valid(d))throw Error('成績快照格式不正確。');const sums=d.teams.map((t,i)=>({i,n:t.s.reduce((a,x)=>a+(x??0),0)}));sums.sort((a,b)=>b.n-a.n||a.i-b.i);let prior=null,rank=0;sums.forEach((x,j)=>{if(x.n!==prior){rank=j+1;prior=x.n}x.rank=rank});const pos=new Map(sums.map(x=>[x.i,x.rank]));get('notice').textContent='成績快照產生時間：'+new Date(d.at).toLocaleString('zh-TW')+'。目前已公布 '+d.locks.filter(Boolean).length+'／4 階段；此連結不會即時更新，請以教師最新分享為準。';for(let i=0;i<d.teams.length;i++){const tr=document.createElement('tr');const cells=[d.teams[i].n,...d.teams[i].s.map((v,s)=>d.locks[s]&&v!==null?fmt(v):'—'),fmt(d.teams[i].s.reduce((a,v)=>a+(v??0),0)),'#'+pos.get(i)];cells.forEach((x,j)=>{const td=document.createElement('td');td.textContent=x;if(j===5)td.className='total';tr.append(td)});get('tbody').append(tr)}for(const item of sums){const tile=document.createElement('div');tile.className='tile';const n=document.createElement('b');n.textContent='#'+item.rank+' '+d.teams[item.i].n;const v=document.createElement('strong');v.textContent=fmt(item.n)+' 分';tile.append(n,v);get('leaders').append(tile)}}catch(e){get('notice').textContent=e.message;get('tbody').innerHTML='<tr><td colspan="7" class="error">無法讀取成績。請向教師索取最新分享連結。</td></tr>';get('leaders').textContent='尚無可顯示的成績。'}})();</script></body></html>
